<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yevyev</title>
<meta name="theme-color" content="#F6F7F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yevyev">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg:#F6F7F9; --surface:#FFFFFF; --ink:#1B2230; --muted:#6B7385; --line:#E2E5EB;
    --accent:#2F3FD1; --onaccent:#FFFFFF; --fold:#AEB6F5;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [data-theme="sepia"] {
    --bg:#E6DAC0; --surface:#F1E7D0; --ink:#43362A; --muted:#8A7960; --line:#D6C8A9;
    --accent:#3C5A8A; --onaccent:#FFFFFF; --fold:#A9BBD6;
  }
  [data-theme="dark"] {
    --bg:#0D0F14; --surface:#14161C; --ink:#D5D9E4; --muted:#7C8498; --line:#262A35;
    --accent:#8E9BFF; --onaccent:#0D0F14; --fold:#3A4180;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--sans); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- Library ---------- */
  #library { position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(var(--sat) + 16px) 18px calc(var(--sab) + 40px); }
  .lib-head { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .lib-head h1 { font-family: var(--serif); font-size: 30px; letter-spacing: -0.02em; margin: 0; flex: 1; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
  .icon-btn:active { background: var(--line); }
  .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn { background: var(--accent); color: var(--onaccent); border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn:active { opacity: .85; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 24px 16px; }
  .card { text-align: left; display: block; width: 100%; position: relative; }
  .cover { position: relative; aspect-ratio: 2 / 3; border-radius: 4px 6px 6px 4px; overflow: hidden;
    background: var(--line);
    clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 0 100%);
    box-shadow: inset 3px 0 0 rgba(0,0,0,.12); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .gen { height: 100%; padding: 14px 12px; display: flex; flex-direction: column; justify-content: space-between;
    color: #fff; font-family: var(--serif); }
  .cover .gen b { font-size: 15px; line-height: 1.2; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .cover .gen small { font-size: 11px; opacity: .8; font-family: var(--sans); }
  .fold { position: absolute; top: 0; right: 0; width: 24px; height: 24px; background: var(--fold);
    clip-path: polygon(0 0, 0 100%, 100% 100%); border-bottom-left-radius: 3px; }
  .card .t { margin: 9px 0 0; font-size: 14px; font-weight: 600; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .m { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .more { position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(20,22,28,.55); color: #fff; display: grid; place-items: center; font-size: 18px; line-height: 1; }

  .empty { text-align: center; padding: 14vh 20px 0; max-width: 360px; margin: 0 auto; }
  .empty h2 { font-family: var(--serif); font-size: 22px; margin: 0 0 8px; }
  .empty p { color: var(--muted); line-height: 1.5; margin: 0 0 22px; font-size: 15px; }

  /* ---------- Reader ---------- */
  #reader { position: fixed; inset: 0; background: var(--surface); z-index: 5; }
  #epub-wrap { position: absolute; inset: 0; padding: calc(var(--sat) + 14px) 22px calc(var(--sab) + 14px); }
  #epub-view { width: 100%; height: 100%; }
  #pdf-view { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch;
    padding: calc(var(--sat) + 6px) 0 calc(var(--sab) + 60px); }
  #pdf-pages { position: relative; width: 100%; margin: 0 auto; }
  .pg { position: relative; width: 100%; margin-bottom: 8px; background: rgba(127,127,127,.1); }
  .pg canvas { display: block; width: 100%; height: auto; }
  [data-theme="dark"] .pg canvas { filter: invert(.9) hue-rotate(180deg); }
  [data-theme="sepia"] .pg canvas { filter: sepia(.45) contrast(.95); }
  #zones { position: absolute; inset: 0; z-index: 6; touch-action: pan-y; }

  .topbar, .botbar { position: absolute; left: 0; right: 0; z-index: 8; background: var(--surface);
    transition: transform .2s ease, opacity .2s ease; }
  .topbar { top: 0; padding: calc(var(--sat) + 6px) 10px 8px; display: flex; align-items: center; gap: 4px;
    border-bottom: 1px solid var(--line); }
  .topbar .ttl { flex: 1; text-align: center; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
  .botbar { bottom: 0; padding: 10px 18px calc(var(--sab) + 12px); border-top: 1px solid var(--line); }
  .botbar .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  #reader.ui-hidden .topbar { transform: translateY(-100%); opacity: 0; pointer-events: none; }
  #reader.ui-hidden .botbar { transform: translateY(100%); opacity: 0; pointer-events: none; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 360px); z-index: 21; background: var(--surface);
    overflow-y: auto; padding: calc(var(--sat) + 16px) 8px calc(var(--sab) + 16px); }
  .drawer h3 { font-family: var(--serif); margin: 0 12px 10px; font-size: 18px; }
  .drawer button.toc { display: block; width: 100%; text-align: left; padding: 11px 12px; font-size: 15px; border-radius: 8px; line-height: 1.3; }
  .drawer button.toc:active { background: var(--line); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface);
    border-radius: 18px 18px 0 0; padding: 20px 20px calc(var(--sab) + 22px); box-shadow: 0 -6px 30px rgba(0,0,0,.2); }
  .sheet .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .sheet .row:last-child { margin-bottom: 0; }
  .sheet .row > span { font-size: 14px; color: var(--muted); }
  .chips { display: flex; gap: 8px; }
  .chip { padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--line); font-size: 14px; font-weight: 600; }
  .chip[data-t="light"] { background: #fff; color: #1B2230; }
  .chip[data-t="sepia"] { background: #F1E7D0; color: #43362A; }
  .chip[data-t="dark"] { background: #14161C; color: #D5D9E4; }
  .chip.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 44px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); font-size: 17px; font-weight: 700; }
  .stepper output { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; }

  #loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 7; background: var(--surface); color: var(--muted); font-size: 15px; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 28px); transform: translateX(-50%); z-index: 40;
    background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: 14px; max-width: 88vw; text-align: center; }

  .filters { display: flex; gap: 8px; margin: 0 0 18px; }
  .fchip { padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 14px; font-weight: 600; color: var(--muted); }
  .fchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .resume { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 14px; margin: 0 0 22px;
    border-radius: 14px; background: var(--surface); border: 1.5px solid var(--accent); }
  .resume .cover { width: 64px; flex: none; }
  .resume .rinfo { flex: 1; min-width: 0; }
  .resume .rk { display: block; font-size: 13px; color: var(--accent); font-weight: 700; margin-bottom: 3px; }
  .resume .rt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-family: var(--serif); font-size: 17px; font-weight: 700; line-height: 1.25; }
  .resume small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .resume .go { flex: none; background: var(--accent); color: var(--onaccent); border-radius: 999px; padding: 9px 16px; font-weight: 600; font-size: 14px; }
  .cwrap { position: relative; }
  .cbtn, .info { display: block; width: 100%; text-align: left; }
  .fav { position: absolute; right: 6px; bottom: 6px; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(20,22,28,.55); color: #fff; display: grid; place-items: center; }
  .fav svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; }
  .fav.on svg { fill: #FF6B81; stroke: #FF6B81; }
  .nofav { color: var(--muted); font-size: 15px; line-height: 1.5; padding: 30px 4px; }
  #bmBtn.on { color: var(--accent); }
  #bmBtn.on svg { fill: currentColor; }
  .tabs { display: flex; gap: 6px; margin: 0 8px 10px; }
  .tabs button { flex: 1; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .tabs button.on { background: var(--line); color: var(--ink); }
  .bmrow { display: flex; align-items: center; }
  .bmrow .toc { flex: 1; }
  .bmrow .del { width: 40px; height: 40px; color: var(--muted); font-size: 22px; flex: none; }
  .drawer button.toc small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  #tocList:empty::before { content: "This book has no contents list."; display: block; padding: 12px; color: var(--muted); font-size: 14px; }
  #bmList:empty::before { content: "No bookmarks yet. Tap the ribbon at the top while you read."; display: block; padding: 12px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  @media (min-width: 800px) {
    #epub-wrap { max-width: 760px; margin: 0 auto; right: 0; left: 0; }
    #pdf-pages { max-width: 900px; }
  }
  @media (prefers-reduced-motion: reduce) { .topbar, .botbar { transition: none; } }
</style>
</head>
<body>

<!-- Library -->
<main id="library">
  <div class="lib-head">
    <h1>Yevyev</h1>
    <button class="btn ghost hidden" id="installBtn">Install</button>
    <button class="icon-btn" id="themeBtn" aria-label="Change theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
    <button class="btn" id="addBtn">Add books</button>
  </div>
  <div id="continue"></div>
  <div class="filters hidden" id="filters">
    <button class="fchip on" data-f="all">All</button>
    <button class="fchip" data-f="fav">Favorites</button>
  </div>
  <div id="grid" class="grid"></div>
  <p id="noFav" class="nofav hidden">No favorites yet. Tap the heart on a book to add it here.</p>
  <div id="empty" class="empty hidden">
    <h2>Your shelf is empty</h2>
    <p>Add an EPUB or PDF from your phone. Your books stay on this device, and your place is saved as you read.</p>
    <button class="btn" id="addBtn2">Choose files</button>
  </div>
  <input type="file" id="file" accept=".epub,.pdf,application/epub+zip,application/pdf" multiple hidden>
</main>

<!-- Reader -->
<section id="reader" class="hidden">
  <div id="loading">Opening book…</div>
  <div id="epub-wrap" class="hidden"><div id="epub-view"></div></div>
  <div id="pdf-view" class="hidden"><div id="pdf-pages"></div></div>
  <div id="zones" class="hidden"></div>

  <div class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back to library"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl" id="rTitle"></div>
    <button class="icon-btn" id="bmBtn" aria-label="Bookmark this spot"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg></button>
    <button class="icon-btn" id="tocBtn" aria-label="Contents and bookmarks"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button class="icon-btn" id="setBtn" aria-label="Reading settings"><svg viewBox="0 0 24 24"><path d="M3 19l5-13 5 13M5 14h6"/><path d="M15 19l3.5-9L22 19M16.2 16h4.6"/></svg></button>
  </div>
  <div class="botbar">
    <div class="lbl"><span id="lblLeft"></span><span id="lblRight"></span></div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position in book">
  </div>
</section>

<div id="scrim" class="hidden"></div>
<aside id="toc" class="drawer hidden"><div class="tabs"><button id="tabToc" class="on">Contents</button><button id="tabBm">Bookmarks</button></div><div id="tocList"></div><div id="bmList" class="hidden"></div></aside>
<div id="sheet" class="sheet hidden">
  <div class="row"><span>Theme</span>
    <div class="chips">
      <button class="chip" data-t="light">Light</button>
      <button class="chip" data-t="sepia">Sepia</button>
      <button class="chip" data-t="dark">Dark</button>
    </div>
  </div>
  <div class="row"><span>Favorite</span><button class="chip" id="favBtn">Add to favorites</button></div>
  <div class="row" id="sizeRow"><span id="sizeLabel">Text size</span>
    <div class="stepper"><button id="sizeDown" aria-label="Smaller">−</button><output id="sizeOut">100%</output><button id="sizeUp" aria-label="Larger">+</button></div>
  </div>
</div>
<div id="toast" class="hidden" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const PDF_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const THEMES = { light: { bg: "#FFFFFF", fg: "#1B2230", bar: "#F6F7F9" }, sepia: { bg: "#F1E7D0", fg: "#43362A", bar: "#E6DAC0" }, dark: { bg: "#14161C", fg: "#D5D9E4", bar: "#0D0F14" } };

  /* ---------- storage ---------- */
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open("yevyev", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("books", { keyPath: "id" });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  async function tx(mode, fn) {
    const db = await dbp;
    return new Promise((res, rej) => {
      const t = db.transaction("books", mode);
      const rq = fn(t.objectStore("books"));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  const putBook = (b) => tx("readwrite", (s) => s.put(b));
  const getBook = (id) => tx("readonly", (s) => s.get(id));
  const delBook = (id) => tx("readwrite", (s) => s.delete(id));
  const allBooks = () => tx("readonly", (s) => s.getAll());

  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const settings = Object.assign({ theme: "light", size: 100, zoom: 100 }, lsGet("yevyev:settings", {}));
  const saveSettings = () => lsSet("yevyev:settings", settings);
  const getProg = (id) => lsGet("yevyev:p:" + id, null);
  const setProg = (id, p) => lsSet("yevyev:p:" + id, Object.assign({}, getProg(id) || {}, p, { t: Date.now() }));

  /* ---------- helpers ---------- */
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const stripExt = (n) => n.replace(/\.(epub|pdf)$/i, "").replace(/[_]+/g, " ");
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 2600);
  }
  function hueOf(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
  function thumb(src, maxW = 300) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, maxW / img.naturalWidth);
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = rej; img.src = src;
    });
  }

  /* ---------- theme ---------- */
  function applyTheme(name) {
    settings.theme = name; saveSettings();
    document.documentElement.dataset.theme = name;
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = THEMES[name].bar;
    document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c.dataset.t === name));
    if (cur.epub && cur.rend) cur.rend.themes.select(name);
  }

  /* ---------- library ---------- */
  const heartSvg = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.6 4.5 6.9 4.5c2 0 3.5 1.1 5.1 3 1.6-1.9 3.1-3 5.1-3 3.3 0 5.3 3.3 4.1 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg>';
  const getFavs = () => lsGet("yevyev:fav", []);
  function toggleFav(id) {
    let f = getFavs(); const on = f.includes(id);
    f = on ? f.filter((x) => x !== id) : f.concat(id); lsSet("yevyev:fav", f);
    return !on;
  }
  let libFilter = "all";
  function coverEl(b) {
    const cover = document.createElement("div"); cover.className = "cover";
    if (b.cover) { const im = document.createElement("img"); im.src = b.cover; im.alt = ""; cover.appendChild(im); }
    else {
      const g = document.createElement("div"); g.className = "gen";
      g.style.background = `hsl(${hueOf(b.title)} 32% 34%)`;
      const t = document.createElement("b"); t.textContent = b.title;
      const s = document.createElement("small"); s.textContent = b.author || b.type.toUpperCase();
      g.append(t, s); cover.appendChild(g);
    }
    const fold = document.createElement("div"); fold.className = "fold"; cover.appendChild(fold);
    return cover;
  }
  async function renderLibrary() {
    const books = await allBooks();
    books.sort((a, b) => ((getProg(b.id) || {}).t || b.added) - ((getProg(a.id) || {}).t || a.added));
    const favs = getFavs();

    // continue reading
    const cont = $("#continue"); cont.innerHTML = "";
    const last = books.find((b) => { const p = getProg(b.id); return p && p.t && p.pct > 0 && p.pct < 0.99; });
    if (last && libFilter === "all") {
      const p = getProg(last.id);
      const r = document.createElement("button"); r.className = "resume";
      const info = document.createElement("div"); info.className = "rinfo";
      const k = document.createElement("span"); k.className = "rk"; k.textContent = "Continue reading";
      const t = document.createElement("span"); t.className = "rt"; t.textContent = last.title;
      const s = document.createElement("small"); s.textContent = Math.round(p.pct * 100) + "% read";
      const bar = document.createElement("div"); bar.className = "bar"; const bi = document.createElement("i"); bi.style.width = Math.round(p.pct * 100) + "%"; bar.appendChild(bi);
      info.append(k, t, s, bar);
      const go = document.createElement("span"); go.className = "go"; go.textContent = "Resume";
      r.append(coverEl(last), info, go);
      r.addEventListener("click", () => openBook(last.id));
      cont.appendChild(r);
    }

    $("#filters").classList.toggle("hidden", books.length === 0);
    const shown = libFilter === "fav" ? books.filter((b) => favs.includes(b.id)) : books;
    const grid = $("#grid"); grid.innerHTML = "";
    $("#empty").classList.toggle("hidden", books.length > 0);
    $("#noFav").classList.toggle("hidden", !(books.length > 0 && libFilter === "fav" && shown.length === 0));

    for (const b of shown) {
      const p = getProg(b.id);
      const card = document.createElement("div"); card.className = "card";
      const cw = document.createElement("div"); cw.className = "cwrap";
      const cb = document.createElement("button"); cb.className = "cbtn"; cb.setAttribute("aria-label", "Open " + b.title);
      cb.appendChild(coverEl(b)); cb.addEventListener("click", () => openBook(b.id));
      const more = document.createElement("button"); more.className = "more"; more.textContent = "⋯"; more.setAttribute("aria-label", "Remove " + b.title);
      more.addEventListener("click", async () => {
        if (confirm("Remove “" + b.title + "” from Yevyev?")) {
          await delBook(b.id);
          try { localStorage.removeItem("yevyev:p:" + b.id); localStorage.removeItem("yevyev:bm:" + b.id); localStorage.setItem("yevyev:fav", JSON.stringify(getFavs().filter((x) => x !== b.id))); } catch {}
          renderLibrary();
        }
      });
      const fav = document.createElement("button"); fav.className = "fav" + (favs.includes(b.id) ? " on" : "");
      fav.innerHTML = heartSvg; fav.setAttribute("aria-label", "Favorite " + b.title);
      fav.addEventListener("click", () => { const on = toggleFav(b.id); toast(on ? "Added to favorites" : "Removed from favorites"); renderLibrary(); });
      cw.append(cb, more, fav);
      const info = document.createElement("button"); info.className = "info";
      const t = document.createElement("p"); t.className = "t"; t.textContent = b.title;
      const m = document.createElement("p"); m.className = "m";
      const pct = p && p.pct ? Math.round(p.pct * 100) : 0;
      m.textContent = pct > 0 ? pct + "% read" : "Not started";
      const bar = document.createElement("div"); bar.className = "bar"; const i = document.createElement("i"); i.style.width = pct + "%"; bar.appendChild(i);
      info.append(t, m, bar); info.addEventListener("click", () => openBook(b.id));
      card.append(cw, info); grid.appendChild(card);
    }
  }
  document.querySelectorAll(".fchip").forEach((c) => c.addEventListener("click", () => {
    libFilter = c.dataset.f;
    document.querySelectorAll(".fchip").forEach((x) => x.classList.toggle("on", x === c));
    renderLibrary();
  }));

  let pdfReady = null;
  function ensurePdf() {
    if (!pdfReady) pdfReady = (async () => {
      if (!window.pdfjsLib) throw new Error("PDF engine not loaded");
      const r = await fetch(PDF_WORKER);
      const blob = new Blob([await r.text()], { type: "text/javascript" });
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
    })().catch((e) => { pdfReady = null; throw e; });
    return pdfReady;
  }

  async function importEpub(f) {
    if (!window.ePub) throw new Error("EPUB engine not loaded");
    const buf = await f.arrayBuffer();
    const book = ePub(buf, { openAs: "binary" });
    await book.ready;
    const meta = await book.loaded.metadata;
    let cover = null;
    try { const u = await book.coverUrl(); if (u) cover = await thumb(u); } catch {}
    try { book.destroy(); } catch {}
    await putBook({ id: uid(), title: (meta.title || "").trim() || stripExt(f.name), author: meta.creator || "", type: "epub", blob: f, cover, added: Date.now() });
  }
  async function importPdf(f) {
    await ensurePdf();
    const buf = await f.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    let title = "", author = "", cover = null;
    try { const m = await doc.getMetadata(); title = (m.info && m.info.Title || "").trim(); author = (m.info && m.info.Author || "").trim(); } catch {}
    try {
      const pg = await doc.getPage(1); const v0 = pg.getViewport({ scale: 1 });
      const vp = pg.getViewport({ scale: 300 / v0.width });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      cover = c.toDataURL("image/jpeg", 0.75);
    } catch {}
    try { doc.destroy(); } catch {}
    await putBook({ id: uid(), title: title || stripExt(f.name), author, type: "pdf", blob: f, cover, added: Date.now() });
  }
  async function importFiles(files) {
    let n = 0;
    for (const f of files) {
      const ext = f.name.split(".").pop().toLowerCase();
      try {
        if (ext === "epub") await importEpub(f);
        else if (ext === "pdf") await importPdf(f);
        else { toast(f.name + " isn’t an EPUB or PDF"); continue; }
        n++;
      } catch (e) { console.error(e); toast("Couldn’t add " + f.name + ". The file may be damaged or protected."); }
    }
    if (n) toast(n === 1 ? "Book added" : n + " books added");
    renderLibrary();
  }

  /* ---------- reader state ---------- */
  const cur = { id: null, type: null, epub: null, rend: null, locReady: false, cfi: null, pdf: null, page: 1, pages: [], obs: null, obs2: null };

  function showUI(on) { $("#reader").classList.toggle("ui-hidden", !on); }
  const uiVisible = () => !$("#reader").classList.contains("ui-hidden");

  async function openBook(id) {
    const b = await getBook(id); if (!b) return;
    cur.id = id; cur.type = b.type; cur.title = b.title;
    $("#reader").classList.remove("hidden", "ui-hidden");
    $("#loading").classList.remove("hidden");
    $("#rTitle").textContent = b.title;
    $("#epub-wrap").classList.add("hidden"); $("#pdf-view").classList.add("hidden"); $("#zones").classList.add("hidden");
    $("#tocList").innerHTML = ""; refreshBm(); refreshFav();
    $("#lblLeft").textContent = ""; $("#lblRight").textContent = "";
    $("#sizeLabel").textContent = b.type === "epub" ? "Text size" : "Zoom";
    updateSizeOut();
    try {
      if (b.type === "epub") await openEpub(b); else await openPdf(b);
      setProg(id, {});
      $("#loading").classList.add("hidden");
      setTimeout(() => { if (cur.id === id) showUI(false); }, 1800);
    } catch (e) {
      console.error(e); toast("Couldn’t open this book"); closeReader();
    }
  }

  async function closeReader() {
    closePanels();
    if (cur.epub) { try { cur.epub.destroy(); } catch {} }
    if (cur.obs) cur.obs.disconnect(); if (cur.obs2) cur.obs2.disconnect();
    if (cur.pdf) { try { cur.pdf.destroy(); } catch {} }
    Object.assign(cur, { chapter: null, endCfi: null, pct: 0, id: null, epub: null, rend: null, locReady: false, cfi: null, pdf: null, pages: [], obs: null, obs2: null });
    $("#epub-view").innerHTML = ""; $("#pdf-pages").innerHTML = "";
    $("#reader").classList.add("hidden");
    renderLibrary();
  }

  /* ---------- EPUB ---------- */
  async function openEpub(b) {
    const buf = await b.blob.arrayBuffer();
    const book = ePub(buf, { openAs: "binary" });
    cur.epub = book; cur.locReady = false;
    $("#epub-wrap").classList.remove("hidden"); $("#zones").classList.remove("hidden");
    const rend = book.renderTo("epub-view", { width: "100%", height: "100%", flow: "paginated", spread: "none" });
    cur.rend = rend;
    for (const [n, c] of Object.entries(THEMES)) {
      rend.themes.register(n, {
        body: { background: c.bg + " !important", color: c.fg + " !important", "font-family": 'Georgia, "Iowan Old Style", serif !important', "line-height": "1.6 !important" },
        "p, div, span, li, h1, h2, h3, h4, h5, h6, blockquote": { color: c.fg + " !important" },
        img: { "max-width": "100% !important" }
      });
    }
    rend.themes.select(settings.theme);
    rend.themes.fontSize(settings.size + "%");

    rend.on("relocated", (loc) => {
      cur.cfi = loc.start.cfi;
      let pct = cur.locReady ? book.locations.percentageFromCfi(cur.cfi) : (loc.start.percentage || 0);
      if (loc.atEnd) pct = 1;
      cur.pct = pct; cur.endCfi = loc.end.cfi;
      setProg(cur.id, { loc: cur.cfi, pct });
      updateEpubUI(pct, loc); refreshBm();
    });
    rend.on("keyup", onKey);

    const saved = getProg(cur.id);
    try { await rend.display(saved && saved.loc ? saved.loc : undefined); }
    catch { await rend.display(); }

    book.loaded.navigation.then((nav) => { buildToc(nav.toc, (href) => rend.display(href)); }).catch(() => {});
    book.ready.then(() => book.locations.generate(1024)).then(() => {
      cur.locReady = true;
      if (cur.cfi && cur.epub === book) {
        const pct = book.locations.percentageFromCfi(cur.cfi);
        setProg(cur.id, { pct }); updateEpubUI(pct);
      }
    }).catch(() => {});
  }
  function updateEpubUI(pct, loc) {
    $("#seek").max = 1000; $("#seek").value = Math.round(pct * 1000);
    $("#lblRight").textContent = Math.round(pct * 100) + "%";
    let label = "";
    try {
      const c = cur.epub.navigation && cur.epub.navigation.get(loc && loc.start.href);
      label = c && c.label ? c.label.trim() : "";
    } catch {}
    if (loc) { cur.chapter = label; $("#lblLeft").textContent = label.slice(0, 40); }
  }

  /* ---------- PDF ---------- */
  async function openPdf(b) {
    await ensurePdf();
    const buf = await b.blob.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    cur.pdf = doc;
    const p1 = await doc.getPage(1); const v = p1.getViewport({ scale: 1 });
    const host = $("#pdf-pages"); host.innerHTML = ""; host.style.width = settings.zoom + "%";
    $("#pdf-view").classList.remove("hidden");
    cur.pages = [];
    cur.obs = new IntersectionObserver((es) => {
      for (const e of es) {
        if (e.isIntersecting) { e.target._want = true; renderPg(e.target); }
        else { e.target._want = false; unrenderPg(e.target); }
      }
    }, { root: $("#pdf-view"), rootMargin: "150% 0px" });
    cur.obs2 = new IntersectionObserver((es) => {
      for (const e of es) if (e.isIntersecting) { cur.page = +e.target.dataset.n; onPdfPage(); }
    }, { root: $("#pdf-view"), rootMargin: "-50% 0px -49% 0px" });
    for (let n = 1; n <= doc.numPages; n++) {
      const el = document.createElement("div"); el.className = "pg"; el.dataset.n = n;
      el.style.aspectRatio = v.width + " / " + v.height;
      el.appendChild(document.createElement("canvas"));
      host.appendChild(el); cur.pages.push(el);
      cur.obs.observe(el); cur.obs2.observe(el);
    }
    $("#seek").min = 1; $("#seek").max = doc.numPages;
    const saved = getProg(cur.id);
    cur.page = saved && saved.page ? Math.min(saved.page, doc.numPages) : 1;
    goPdfPage(cur.page);
    onPdfPage();
    buildPdfToc(doc);
  }
  async function renderPg(el) {
    if (el._busy || el._done || !cur.pdf) return;
    el._busy = true; let retry = false;
    try {
      const page = await cur.pdf.getPage(+el.dataset.n);
      const base = page.getViewport({ scale: 1 });
      const cssW = el.clientWidth || window.innerWidth;
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const vp = page.getViewport({ scale: (cssW / base.width) * dpr });
      const c = el.querySelector("canvas");
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      el.style.aspectRatio = base.width + " / " + base.height;
      const task = page.render({ canvasContext: c.getContext("2d"), viewport: vp });
      el._task = task; await task.promise; el._done = true;
    } catch (e) {
      if (e && e.name === "RenderingCancelledException") retry = true; else console.warn(e);
    } finally {
      el._busy = false; el._task = null;
      if (retry && el._want && !el._done) renderPg(el);
    }
  }
  function unrenderPg(el) {
    if (el._task) { try { el._task.cancel(); } catch {} }
    const c = el.querySelector("canvas"); c.width = 0; c.height = 0; el._done = false;
  }
  function goPdfPage(n) { const el = cur.pages[n - 1]; if (el) $("#pdf-view").scrollTop = el.offsetTop; }
  function onPdfPage() {
    const total = cur.pdf ? cur.pdf.numPages : 1;
    $("#seek").value = cur.page;
    $("#lblLeft").textContent = "Page " + cur.page + " of " + total;
    const pct = total > 1 ? (cur.page - 1) / (total - 1) : 1;
    $("#lblRight").textContent = Math.round(pct * 100) + "%";
    cur.pct = pct; setProg(cur.id, { page: cur.page, pct }); refreshBm();
  }
  async function buildPdfToc(doc) {
    try {
      const out = await doc.getOutline(); if (!out || !out.length) return;
      const items = [];
      const walk = async (list, depth) => {
        for (const it of list) {
          let idx = null;
          try {
            let dest = it.dest; if (typeof dest === "string") dest = await doc.getDestination(dest);
            if (dest && dest[0]) idx = await doc.getPageIndex(dest[0]);
          } catch {}
          items.push({ label: it.title, depth, idx });
          if (it.items && it.items.length) await walk(it.items, depth + 1);
        }
      };
      await walk(out, 0);
      const list = $("#tocList"); list.innerHTML = "";
      for (const it of items) {
        if (it.idx == null) continue;
        const b = document.createElement("button"); b.className = "toc"; b.textContent = it.label;
        b.style.paddingLeft = 12 + it.depth * 16 + "px";
        b.addEventListener("click", () => { goPdfPage(it.idx + 1); closePanels(); });
        list.appendChild(b);
      }
    } catch {}
  }

  /* ---------- contents drawer / panels ---------- */
  function buildToc(toc, go) {
    const list = $("#tocList"); list.innerHTML = "";
    const walk = (items, depth) => items.forEach((it) => {
      const b = document.createElement("button"); b.className = "toc";
      b.textContent = (it.label || "").trim(); b.style.paddingLeft = 12 + depth * 16 + "px";
      b.addEventListener("click", () => { go(it.href); closePanels(); });
      list.appendChild(b);
      if (it.subitems && it.subitems.length) walk(it.subitems, depth + 1);
    });
    walk(toc, 0);
  }
  function openPanel(id) { $("#scrim").classList.remove("hidden"); $(id).classList.remove("hidden"); }
  function closePanels() { $("#scrim").classList.add("hidden"); $("#toc").classList.add("hidden"); $("#sheet").classList.add("hidden"); }

  function updateSizeOut() {
    $("#sizeOut").textContent = (cur.type === "pdf" ? settings.zoom : settings.size) + "%";
  }
  function changeSize(dir) {
    if (cur.type === "pdf") {
      settings.zoom = Math.max(100, Math.min(300, settings.zoom + dir * 25)); saveSettings();
      $("#pdf-pages").style.width = settings.zoom + "%";
      cur.pages.forEach((el) => { unrenderPg(el); cur.obs.unobserve(el); cur.obs.observe(el); });
      setTimeout(() => goPdfPage(cur.page), 50);
    } else {
      settings.size = Math.max(70, Math.min(220, settings.size + dir * 10)); saveSettings();
      if (cur.rend) cur.rend.themes.fontSize(settings.size + "%");
    }
    updateSizeOut();
  }

  /* ---------- navigation ---------- */
  function next() { if (cur.type === "epub" && cur.rend) cur.rend.next(); }
  function prev() { if (cur.type === "epub" && cur.rend) cur.rend.prev(); }
  function onKey(e) {
    if ($("#reader").classList.contains("hidden")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { next(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { prev(); }
    else if (e.key === "Escape") { closePanels(); }
  }
  document.addEventListener("keyup", onKey);

  // tap zones + swipe (EPUB)
  (() => {
    const z = $("#zones"); let sx = 0, sy = 0, st = 0;
    z.addEventListener("touchstart", (e) => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
    z.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 700) {
        e.preventDefault(); showUI(false); dx < 0 ? next() : prev();
      }
    });
    z.addEventListener("click", (e) => {
      const x = e.clientX / window.innerWidth;
      if (x < 0.3) { showUI(false); prev(); }
      else if (x > 0.7) { showUI(false); next(); }
      else showUI(!uiVisible());
    });
  })();
  // tap to toggle bars (PDF)
  $("#pdf-view").addEventListener("click", () => {
    const sel = window.getSelection && String(window.getSelection());
    if (!sel) showUI(!uiVisible());
  });

  $("#seek").addEventListener("input", (e) => {
    const v = +e.target.value;
    if (cur.type === "pdf") { cur.page = v; goPdfPage(v); }
  });
  $("#seek").addEventListener("change", (e) => {
    const v = +e.target.value;
    if (cur.type === "epub" && cur.locReady) {
      try { cur.rend.display(cur.epub.locations.cfiFromPercentage(v / 1000)); } catch {}
    } else if (cur.type === "epub") toast("Still mapping the book. Try again in a moment.");
  });

  window.addEventListener("resize", () => {
    if (cur.rend) { const w = $("#epub-view").clientWidth, h = $("#epub-view").clientHeight; if (w && h) try { cur.rend.resize(w, h); } catch {} }
  });

  /* ---------- bookmarks & favorite ---------- */
  const getBms = () => lsGet("yevyev:bm:" + cur.id, []);
  const setBms = (l) => lsSet("yevyev:bm:" + cur.id, l);
  function bmHere(list) {
    if (cur.type === "pdf") return list.filter((b) => b.page === cur.page);
    return list.filter((b) => {
      try {
        if (!cur.cfi) return false;
        if (!cur.endCfi) return b.loc === cur.cfi;
        const c = new ePub.CFI();
        return c.compare(b.loc, cur.cfi) >= 0 && c.compare(b.loc, cur.endCfi) <= 0;
      } catch { return false; }
    });
  }
  function refreshBm() { if (cur.id) $("#bmBtn").classList.toggle("on", bmHere(getBms()).length > 0); }
  function toggleBm() {
    if (!cur.id) return;
    let list = getBms(); const here = bmHere(list);
    if (here.length) { const ids = here.map((b) => b.id); list = list.filter((b) => !ids.includes(b.id)); toast("Bookmark removed"); }
    else {
      const bm = { id: uid(), t: Date.now(), pct: cur.pct || 0 };
      if (cur.type === "pdf") { bm.page = cur.page; bm.label = "Page " + cur.page; }
      else { if (!cur.cfi) return; bm.loc = cur.cfi; bm.label = cur.chapter || "Saved spot"; }
      list.push(bm); toast("Bookmarked");
    }
    setBms(list); refreshBm(); renderBms();
  }
  function renderBms() {
    const box = $("#bmList"); box.innerHTML = "";
    const list = getBms().sort((a, b) => (a.pct || 0) - (b.pct || 0));
    for (const bm of list) {
      const row = document.createElement("div"); row.className = "bmrow";
      const go = document.createElement("button"); go.className = "toc";
      go.textContent = bm.label || "Bookmark";
      const sm = document.createElement("small");
      sm.textContent = (bm.page ? "Page " + bm.page + " · " : "") + Math.round((bm.pct || 0) * 100) + "% · " + new Date(bm.t).toLocaleDateString();
      go.appendChild(sm);
      go.addEventListener("click", () => {
        if (bm.page) goPdfPage(bm.page); else if (cur.rend) cur.rend.display(bm.loc);
        closePanels();
      });
      const del = document.createElement("button"); del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Delete bookmark");
      del.addEventListener("click", () => { setBms(getBms().filter((x) => x.id !== bm.id)); refreshBm(); renderBms(); });
      row.append(go, del); box.appendChild(row);
    }
  }
  function showTab(name) {
    $("#tabToc").classList.toggle("on", name === "toc"); $("#tabBm").classList.toggle("on", name === "bm");
    $("#tocList").classList.toggle("hidden", name !== "toc"); $("#bmList").classList.toggle("hidden", name !== "bm");
    if (name === "bm") renderBms();
  }
  function refreshFav() {
    const on = cur.id && getFavs().includes(cur.id);
    $("#favBtn").textContent = on ? "Favorited ✓" : "Add to favorites";
    $("#favBtn").classList.toggle("on", !!on);
  }
  $("#bmBtn").addEventListener("click", toggleBm);
  $("#tabToc").addEventListener("click", () => showTab("toc"));
  $("#tabBm").addEventListener("click", () => showTab("bm"));
  $("#favBtn").addEventListener("click", () => { if (!cur.id) return; const on = toggleFav(cur.id); refreshFav(); toast(on ? "Added to favorites" : "Removed from favorites"); });

  /* ---------- wiring ---------- */
  const fileInput = $("#file");
  const pick = () => fileInput.click();
  $("#addBtn").addEventListener("click", pick);
  $("#addBtn2").addEventListener("click", pick);
  fileInput.addEventListener("change", async () => { const fs = Array.from(fileInput.files); fileInput.value = ""; if (fs.length) await importFiles(fs); });
  $("#backBtn").addEventListener("click", closeReader);
  $("#tocBtn").addEventListener("click", () => { showTab($("#tocList").children.length ? "toc" : "bm"); openPanel("#toc"); });
  $("#setBtn").addEventListener("click", () => openPanel("#sheet"));
  $("#scrim").addEventListener("click", closePanels);
  $("#sizeUp").addEventListener("click", () => changeSize(1));
  $("#sizeDown").addEventListener("click", () => changeSize(-1));
  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => applyTheme(c.dataset.t)));
  $("#themeBtn").addEventListener("click", () => {
    const order = ["light", "sepia", "dark"]; applyTheme(order[(order.indexOf(settings.theme) + 1) % 3]);
  });

  // install button (Android / desktop Chrome)
  let deferred;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; $("#installBtn").classList.remove("hidden"); });
  $("#installBtn").addEventListener("click", async () => {
    if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("#installBtn").classList.add("hidden");
  });
  window.addEventListener("appinstalled", () => $("#installBtn").classList.add("hidden"));

  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  applyTheme(settings.theme);
  renderLibrary();
})();
</script>
